<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="description" content="Perpustakaan Digital Desa Tambaksari - Koleksi buku digital gratis. Baca online atau download PDF.">
  <title>Perpustakaan Digital | Desa Tambaksari</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0f1c;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .logo p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .back-link {
      background: #1e293b;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      text-decoration: none;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .back-link:hover {
      background: #334155;
      transform: translateX(-3px);
    }

    /* Search & Filter Bar */
    .search-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    .search-wrapper {
      flex: 3;
      display: flex;
      align-items: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 60px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .search-wrapper:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.3);
    }
    .search-wrapper i {
      padding: 0 1rem;
      color: #94a3b8;
    }
    .search-wrapper input {
      flex: 1;
      border: none;
      padding: 0.9rem 0;
      font-size: 0.95rem;
      outline: none;
      background: transparent;
      font-family: inherit;
      color: #f1f5f9;
    }
    .search-wrapper input::placeholder {
      color: #64748b;
    }
    .filter-select {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 60px;
      padding: 0 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #f1f5f9;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: #3b82f6;
      border: none;
      padding: 0 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      font-size: 0.9rem;
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: scale(1.02);
    }

    /* Category chips */
    .categories-wrapper {
      margin: 1rem 0 1.5rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: thin;
      padding-bottom: 0.5rem;
    }
    .categories-list {
      display: inline-flex;
      gap: 0.7rem;
    }
    .category-chip {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
    }
    .category-chip i {
      font-size: 0.7rem;
      color: #60a5fa;
    }
    .category-chip.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .category-chip.active i {
      color: white;
    }
    .category-chip:hover:not(.active) {
      background: #334155;
      transform: translateY(-2px);
    }

    /* Stats */
    .stats-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.8rem;
    }

    /* Books Grid - Responsive Modern */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    /* Card Style */
    .book-card {
      background: #0f172a;
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid #1e293b;
      position: relative;
    }
    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(59,130,246,0.4);
    }

    /* Bookmark button top right */
    .bookmark-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 1rem;
      transition: 0.2s;
      z-index: 5;
    }
    .bookmark-btn:hover {
      transform: scale(1.1);
    }
    .bookmark-btn.bookmarked {
      color: #f59e0b;
    }

    /* Cover */
    .card-cover {
  aspect-ratio: 4 / 3;   /* lebih cocok untuk landscape ebook, bisa juga auto */
  background: #0a0f1c;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card-cover img {
  width: 100%;
  height: 100%;
  object-fit: contain;   /* tidak terpotong, tampilkan seluruh sampul */
  background: #0a0f1c;
  padding: 4px;
}
    .book-card:hover .card-cover img {
      transform: scale(1.03);
    }
    .card-cover i {
      font-size: 3.5rem;
      color: #334155;
    }

    /* Book Info */
    .book-info {
      padding: 1rem;
    }
    .book-title {
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #f1f5f9;
    }
    .book-author {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-category {
      display: inline-block;
      background: #1e293b;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 0.65rem;
      font-weight: 600;
      color: #a5f3fc;
      margin-bottom: 12px;
    }

    /* Action Buttons */
    .book-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .book-actions a {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-read {
      background: #3b82f6;
      color: white;
    }
    .btn-read:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn-download {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-download:hover {
      background: #334155;
      transform: translateY(-2px);
    }

    /* Pagination */
    .pagination {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin: 2rem 0 1rem;
    }
    .page-btn {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.4rem 0.9rem;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: 0.2s;
      color: #cbd5e1;
    }
    .page-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .page-btn:hover:not(.active) {
      background: #334155;
    }

    /* Loading & Error */
    .loading, .error {
      text-align: center;
      padding: 3rem;
      background: #0f172a;
      border-radius: 24px;
      margin: 2rem 0;
    }
    .error {
      color: #f87171;
    }

    /* Footer */
    .footer {
      margin-top: 3rem;
      padding: 1.5rem 0;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .books-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
      .book-title { font-size: 0.8rem; }
      .book-actions a { font-size: 0.65rem; padding: 6px 0; }
      .btn-primary, .filter-select { padding: 0 1rem; height: 46px; }
    }
    @media (max-width: 480px) {
      .books-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-info { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <h1><i class="fas fa-book-open"></i> Perpustakaan Digital</h1>
      <p>Desa Tambaksari, Karawang</p>
    </div>
    <a href="#" class="back-link" id="backToBeranda"><i class="fas fa-arrow-left"></i> Kembali ke Beranda Desa</a>
  </div>

  <!-- Search & Filter -->
  <div class="search-filter-bar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Cari judul buku...">
    </div>
    <select id="categorySelect" class="filter-select">
      <option value="all">📚 Semua Kategori</option>
    </select>
    <button id="searchBtn" class="btn-primary"><i class="fas fa-search"></i> Cari</button>
  </div>

  <!-- Category Chips -->
  <div class="categories-wrapper">
    <div class="categories-list" id="categoriesList"></div>
  </div>

  <!-- Stats -->
  <div class="stats-info">
    <span id="bookCount">0 buku ditemukan</span>
  </div>

  <!-- Books Container -->
  <div id="booksContainer" class="books-grid"></div>
  <div id="loadingMessage" class="loading">📚 Memuat koleksi buku...</div>
  <div id="paginationContainer" class="pagination"></div>

  <!-- Footer -->
  <div class="footer">
    <p><i class="fas fa-copyright"></i> 2026 Perpustakaan Digital Desa Tambaksari | Buku disimpan di Google Drive | Akses gratis untuk semua</p>
  </div>
</div>

<script>
  // ================= KONFIGURASI =================
  const API_KEY = 'AIzaSyDHw6lgfHgl4gpPh1JMXtrrrrTX9QUCuV8';
  const ROOT_FOLDER_ID = '1qMGVgwfiTm2WlRWfiYiZGaBU5YXFI2f1';
  // ==============================================

  let allBooks = [];
  let filteredBooks = [];
  let currentPage = 1;
  let itemsPerPage = 12;
  let currentCategory = "all";
  let currentKeyword = "";
  
  // Bookmark storage
  let bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || [];

  function saveBookmarks() {
    localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
  }

  function isBookmarked(bookId) {
    return bookmarks.includes(bookId);
  }

  function toggleBookmark(bookId) {
    if (isBookmarked(bookId)) {
      bookmarks = bookmarks.filter(id => id !== bookId);
    } else {
      bookmarks.push(bookId);
    }
    saveBookmarks();
    // Re-render current page to update bookmark icons
    renderBooks();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function getThumbnailUrl(fileId) {
    return `https://drive.google.com/thumbnail?id=${fileId}&sz=w400`;
  }

  // Rekursif ambil semua folder ID
  async function getAllFolderIds(parentId, folderMap = new Map()) {
    let folderIds = [parentId];
    let pageToken = null;
    try {
      do {
        let url = `https://www.googleapis.com/drive/v3/files?q='${parentId}'+in+parents+and+mimeType='application/vnd.google-apps.folder'&key=${API_KEY}&fields=nextPageToken,files(id,name)&pageSize=100`;
        if (pageToken) url += `&pageToken=${pageToken}`;
        const response = await fetch(url);
        if (!response.ok) break;
        const data = await response.json();
        if (data.files && data.files.length) {
          for (const folder of data.files) {
            folderIds.push(folder.id);
            folderMap.set(folder.id, folder.name);
            const subFolders = await getAllFolderIds(folder.id, folderMap);
            folderIds.push(...subFolders);
          }
        }
        pageToken = data.nextPageToken;
      } while (pageToken);
    } catch(e) { console.error(e); }
    return [...new Set(folderIds)];
  }

  async function fetchAllPdfs() {
    const loadingMsg = document.getElementById('loadingMessage');
    loadingMsg.innerHTML = '📂 Memindai struktur folder dan buku...';
    
    const folderMap = new Map();
    const allFolderIds = await getAllFolderIds(ROOT_FOLDER_ID, folderMap);
    folderMap.set(ROOT_FOLDER_ID, 'Umum');
    
    let allPdfFiles = [];
    for (const folderId of allFolderIds) {
      let pageToken = null;
      do {
        let url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType='application/pdf'&key=${API_KEY}&fields=nextPageToken,files(id,name,webContentLink)&pageSize=100`;
        if (pageToken) url += `&pageToken=${pageToken}`;
        const response = await fetch(url);
        if (!response.ok) continue;
        const data = await response.json();
        if (data.files && data.files.length) {
          let category = folderMap.get(folderId) || 'Umum';
          category = category.trim();
          if (category === '' || category === 'Root') category = 'Umum';
          for (const file of data.files) {
            allPdfFiles.push({
              id: file.id,
              name: file.name.replace(/\.pdf$/i, ''),
              category: category,
              downloadUrl: file.webContentLink || `https://drive.google.com/uc?export=download&id=${file.id}`,
              previewUrl: `https://drive.google.com/file/d/${file.id}/preview`,
              thumbnail: getThumbnailUrl(file.id)
            });
          }
        }
        pageToken = data.nextPageToken;
      } while (pageToken);
    }
    
    // Hapus duplikat
    const unique = [];
    const seen = new Set();
    for (const book of allPdfFiles) {
      if (!seen.has(book.id)) {
        seen.add(book.id);
        unique.push(book);
      }
    }
    return unique;
  }

  function renderBooks() {
    let result = [...allBooks];
    if (currentCategory !== 'all') {
      result = result.filter(b => b.category === currentCategory);
    }
    if (currentKeyword.trim() !== '') {
      const kw = currentKeyword.toLowerCase();
      result = result.filter(b => b.name.toLowerCase().includes(kw));
    }
    filteredBooks = result;
    
    document.getElementById('bookCount').innerText = `${filteredBooks.length} buku ditemukan`;
    
    const totalPages = Math.ceil(filteredBooks.length / itemsPerPage);
    if (currentPage > totalPages) currentPage = totalPages || 1;
    const start = (currentPage - 1) * itemsPerPage;
    const pageBooks = filteredBooks.slice(start, start + itemsPerPage);
    
    const container = document.getElementById('booksContainer');
    const loadingMsg = document.getElementById('loadingMessage');
    if (filteredBooks.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:3rem; background:#0f172a; border-radius:1rem;">📭 Tidak ada buku yang sesuai.</div>`;
      loadingMsg.style.display = 'none';
      document.getElementById('paginationContainer').innerHTML = '';
      return;
    }
    loadingMsg.style.display = 'none';
    
    let html = '';
    for (const book of pageBooks) {
      const bookmarked = isBookmarked(book.id);
      html += `
        <div class="book-card" data-id="${book.id}">
          <button class="bookmark-btn ${bookmarked ? 'bookmarked' : ''}" data-id="${book.id}">
            <i class="fas ${bookmarked ? 'fa-bookmark' : 'fa-bookmark'}"></i>
          </button>
          <div class="card-cover">
            <img src="${book.thumbnail}" alt="Cover" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fas fa-book\'></i>';">
          </div>
          <div class="book-info">
            <div class="book-title">${escapeHtml(book.name)}</div>
            <div class="book-author"><i class="fas fa-user"></i> Perpustakaan Desa</div>
            <div class="book-category"><i class="fas fa-folder"></i> ${escapeHtml(book.category)}</div>
            <div class="book-actions">
              <a href="${book.previewUrl}" class="btn-read" target="_blank" rel="noopener"><i class="fas fa-book-open"></i> Baca</a>
              <a href="${book.downloadUrl}" class="btn-download" target="_blank" rel="noopener"><i class="fas fa-download"></i> Unduh</a>
            </div>
          </div>
        </div>
      `;
    }
    container.innerHTML = html;
    
    // Attach bookmark events
    document.querySelectorAll('.bookmark-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const id = btn.getAttribute('data-id');
        toggleBookmark(id);
      });
    });
    
    renderPagination(totalPages);
  }
  
  function renderPagination(totalPages) {
    const pContainer = document.getElementById('paginationContainer');
    if (totalPages <= 1) {
      pContainer.innerHTML = '';
      return;
    }
    let html = '';
    if (currentPage > 1) html += `<button class="page-btn" data-page="${currentPage-1}">‹ Sebelumnya</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === currentPage) html += `<button class="page-btn active" data-page="${i}">${i}</button>`;
      else if (i === 1 || i === totalPages || (i >= currentPage-1 && i <= currentPage+1)) {
        html += `<button class="page-btn" data-page="${i}">${i}</button>`;
      } else if (i === currentPage-2 || i === currentPage+2) {
        html += `<span style="padding:0 5px;">...</span>`;
      }
    }
    if (currentPage < totalPages) html += `<button class="page-btn" data-page="${currentPage+1}">Selanjutnya ›</button>`;
    pContainer.innerHTML = html;
    document.querySelectorAll('.page-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const page = parseInt(btn.getAttribute('data-page'));
        if (!isNaN(page) && page !== currentPage) {
          currentPage = page;
          renderBooks();
          window.scrollTo({ top: 300, behavior: 'smooth' });
        }
      });
    });
  }
  
  function buildCategories() {
    const categories = ['all', ...new Set(allBooks.map(b => b.category))];
    const select = document.getElementById('categorySelect');
    select.innerHTML = '';
    for (let cat of categories) {
      const option = document.createElement('option');
      option.value = cat === 'all' ? 'all' : cat;
      option.textContent = cat === 'all' ? '📚 Semua Kategori' : cat;
      if ((currentCategory === cat) || (cat === 'all' && currentCategory === 'all')) option.selected = true;
      select.appendChild(option);
    }
    const chipsContainer = document.getElementById('categoriesList');
    chipsContainer.innerHTML = '';
    for (let cat of categories) {
      const chip = document.createElement('div');
      chip.className = `category-chip ${currentCategory === cat ? 'active' : ''}`;
      chip.setAttribute('data-category', cat);
      chip.innerHTML = `<i class="fas fa-folder"></i> ${cat === 'all' ? 'Semua' : cat}`;
      chip.addEventListener('click', () => {
        currentCategory = cat;
        currentPage = 1;
        document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        document.getElementById('categorySelect').value = cat;
        renderBooks();
      });
      chipsContainer.appendChild(chip);
    }
  }
  
  async function init() {
    try {
      const books = await fetchAllPdfs();
      if (!books.length) {
        document.getElementById('loadingMessage').innerHTML = '⚠️ Belum ada file PDF di folder. Silakan upload buku ke Google Drive.';
        return;
      }
      allBooks = books;
      buildCategories();
      renderBooks();
    } catch (err) {
      console.error(err);
      document.getElementById('loadingMessage').innerHTML = '<div class="error">❌ Gagal memuat data. Periksa API Key dan izin folder publik.</div>';
    }
  }
  
  // Event listeners
  document.addEventListener('DOMContentLoaded', () => {
    init();
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const categorySelect = document.getElementById('categorySelect');
    
    searchBtn.addEventListener('click', () => {
      currentKeyword = searchInput.value;
      currentPage = 1;
      renderBooks();
    });
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });
    categorySelect.addEventListener('change', (e) => {
      currentCategory = e.target.value;
      currentPage = 1;
      document.querySelectorAll('.category-chip').forEach(chip => {
        if (chip.getAttribute('data-category') === currentCategory) chip.classList.add('active');
        else chip.classList.remove('active');
      });
      renderBooks();
    });
    document.getElementById('backToBeranda').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = 'https://3215092006.website.desa.id/';
    });
  });
</script>
</body>
</html>
